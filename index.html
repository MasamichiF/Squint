<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>スクイント・シミュレータ</title>
  <meta name="description" content="画像の明暗と大きな形を確認するためのスクイント・シミュレータ。美術の「目を細めて見る」技法をブラウザ上で再現します。">
  <meta property="og:title" content="スクイント・シミュレータ">
  <meta property="og:description" content="画像のディテールを落とし、明暗と大きな形を確認する美術用観察ツール。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://masamichif.github.io/Squint/">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>スクイント・シミュレータ</h1>
    <p>美術の「目を細めて見る」技法を再現します。ディテールが消え、明暗と大きな形だけが残ります。</p>
  </header>

  <main>
    <div class="intake">
      <div id="dropzone" class="dropzone" role="button" tabindex="0" aria-label="画像を選択またはドラッグ&amp;ドロップ" aria-describedby="dropzoneError">
        <p>クリックして画像を選択、またはここへドラッグ&amp;ドロップ</p>
        <input type="file" id="fileInput" accept="image/*" hidden>
      </div>
      <p id="dropzoneError" class="dropzone-error" role="alert"></p>
      <p class="privacy-note">画像はブラウザ内だけで処理され、サーバーには送信されません。</p>
    </div>

    <div id="stage" class="stage hidden">
      <div class="image-area">
        <div class="image-wrap">
          <img id="image" alt="アップロードされた画像" draggable="false">
        </div>
        <div class="grid-overlay" aria-hidden="true"></div>
      </div>
      <p id="viewStatus" class="view-status" aria-live="polite">現在: スクイント</p>
      <div class="stage-buttons">
        <button id="toggleBtn" type="button">原画を表示（ホバー中も原画）</button>
        <button id="flipBtn" type="button" aria-pressed="false">左右反転</button>
        <button id="zoomBtn" type="button" aria-pressed="false">原寸表示</button>
        <button id="gridThirdsBtn" type="button" aria-pressed="false">三分割</button>
        <button id="gridCrossBtn" type="button" aria-pressed="false">十字</button>
      </div>
    </div>

    <section class="controls">
      <div id="presets" class="presets" role="group" aria-label="プリセット"></div>
      <label>
        <span>ぼかし</span>
        <input type="range" id="blur" min="0" max="20" step="0.1" value="3">
        <output id="blurOut">3.0 px</output>
      </label>
      <label>
        <span>コントラスト</span>
        <input type="range" id="contrast" min="50" max="250" step="1" value="130">
        <output id="contrastOut">130 %</output>
      </label>
      <label>
        <span>彩度</span>
        <input type="range" id="saturate" min="0" max="150" step="1" value="40">
        <output id="saturateOut">40 %</output>
      </label>
      <label>
        <span>ポスタリゼーション（段数）</span>
        <input type="range" id="poster" min="2" max="16" step="1" value="5">
        <output id="posterOut">5 段</output>
      </label>
    </section>
  </main>

  <svg width="0" height="0" style="position:absolute">
    <defs>
      <filter id="squintFilter" x="-15%" y="-15%" width="130%" height="130%">
        <!-- 光学的ボケ: リニア光で処理（横方向をやや強く＝まぶたの隙間） -->
        <feGaussianBlur id="fBlur" stdDeviation="3 1.8" color-interpolation-filters="linearRGB"></feGaussianBlur>
        <!-- コントラスト: sRGB で中間（0.5）を軸にスケール -->
        <feComponentTransfer color-interpolation-filters="sRGB">
          <feFuncR id="conR" type="linear" slope="1.3" intercept="-0.15"></feFuncR>
          <feFuncG id="conG" type="linear" slope="1.3" intercept="-0.15"></feFuncG>
          <feFuncB id="conB" type="linear" slope="1.3" intercept="-0.15"></feFuncB>
        </feComponentTransfer>
        <!-- 彩度: sRGB -->
        <feColorMatrix id="fSat" type="saturate" values="0.4" color-interpolation-filters="sRGB" result="toned"></feColorMatrix>
        <!-- 輝度ベース階調化: Y を抽出→量子化し、差分(Yq-Y)を全チャンネルへ等量加算（色相を保持） -->
        <feColorMatrix in="toned" type="matrix"
          values="0.2126 0.7152 0.0722 0 0
                  0.2126 0.7152 0.0722 0 0
                  0.2126 0.7152 0.0722 0 0
                  0      0      0      1 0"
          color-interpolation-filters="sRGB" result="luma"></feColorMatrix>
        <feComponentTransfer in="luma" color-interpolation-filters="sRGB" result="lumaQ">
          <feFuncR id="posterR" type="discrete" tableValues="0 0.25 0.5 0.75 1"></feFuncR>
          <feFuncG id="posterG" type="discrete" tableValues="0 0.25 0.5 0.75 1"></feFuncG>
          <feFuncB id="posterB" type="discrete" tableValues="0 0.25 0.5 0.75 1"></feFuncB>
        </feComponentTransfer>
        <!-- 差分 D'=(Yq-Y)/2+0.5 を [0,1] に収めて算出 -->
        <feComposite in="lumaQ" in2="luma" operator="arithmetic"
          k1="0" k2="0.5" k3="-0.5" k4="0.5"
          color-interpolation-filters="sRGB" result="vdelta"></feComposite>
        <!-- 元の色へ (Yq-Y)=2*D'-1 を加算 -->
        <feComposite in="toned" in2="vdelta" operator="arithmetic"
          k1="0" k2="1" k3="2" k4="-1"
          color-interpolation-filters="sRGB"></feComposite>
      </filter>
    </defs>
  </svg>

  <script src="script.js"></script>
</body>
</html>
